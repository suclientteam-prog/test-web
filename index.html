<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#cfeeff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little Star English – NEMO 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/art.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Little Star home">
      <img class="brand-logo" id="brandLogo" alt="">
      <span class="brand-text">
        <span class="brand-name">Little Star</span>
        <span class="brand-class">NEMO 2 &nbsp;|&nbsp; 14/9 – 02/10</span>
      </span>
    </a>
    <div class="hud">
      <button class="hbtn" id="musicBtn" aria-pressed="true" aria-label="Turn music off"></button>
      <a class="hbtn" id="stickerBtn" href="#stickers" aria-label="Sticker book">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4.5A2.5 2.5 0 016.5 2H20v16H6.5a1.5 1.5 0 000 3H20v1H6.5A2.5 2.5 0 014 19.5z"/><path d="M12 5.5l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="#ffc53d"/></svg>
        <span class="hbtn-num" id="stickerNum">0</span>
        <span class="dot" id="stickerDot" hidden></span>
      </a>
      <div class="star-count" id="starCount" aria-live="polite" title="Sao của bé">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
        <span id="starNum">0</span>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="hills" aria-hidden="true"></div>
  <div class="burst" id="burst" aria-hidden="true"></div>

  <script src="js/assets.js"></script>
  <script src="js/art.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
